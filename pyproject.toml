[project]
name = "manga-tracker-mcp"
version = "0.1.0"
description = "MCP server for a manga / manhwa reading library: progress, new chapters, site search, and finding comics by theme"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
manga-mcp = "manga_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["manga_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
